<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Notification</title>
</head>
<body>
<h1>New Notification</h1>

<form th:action="@{/notifications/emailSend}" method="post">
    <div>
        <label for="channelType">Delivery Channel:</label><br>
        <select id="channelType" name="channelType">
            <option th:each="ch : ${channels}" th:value="${ch}" th:text="${ch}" th:selected="${ch.name() == 'EMAIL'}">EMAIL</option>
        </select>
    </div>
    <br>
    <div>
        <label for="to">To (TO):</label><br>
        <input type="text" id="to" name="to" required>
    </div>
    <br>
    <div>
        <label for="cc">Carbon Copy (CC):</label><br>
        <input type="text" id="cc" name="cc">
    </div>
    <br>
    <div>
        <label for="bcc">Blind Carbon Copy (BCC):</label><br>
        <input type="text" id="bcc" name="bcc">
    </div>
    <br>
    <div>
        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject" required>
    </div>
    <br>
    <div>
        <label for="content">Content:</label><br>
        <textarea id="content" name="content" rows="6" cols="40" required></textarea>
    </div>
    <br>
    <button type="submit">Send</button>
    <a th:href="@{/notifications}">Cancel</a>
</form>
</body>
</html>
